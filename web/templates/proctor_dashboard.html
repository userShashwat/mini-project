<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proctoring AI - Proctor Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #fff;
        }
        
        .navbar {
            background: #16213e;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #e94560;
        }
        
        .navbar h1 {
            font-size: 1.5rem;
            color: #fff;
        }
        
        .navbar h1 span {
            color: #e94560;
        }
        
        .stats {
            display: flex;
            gap: 2rem;
        }
        
        .stat {
            background: #0f3460;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: #aaa;
        }
        
        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #e94560;
        }
        
        .container {
            display: flex;
            padding: 1rem;
            gap: 1rem;
            height: calc(100vh - 80px);
        }
        
        .students-grid {
            flex: 3;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            overflow-y: auto;
            padding: 0.5rem;
        }
        
        .student-card {
            background: #0f3460;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.2s;
            border: 2px solid transparent;
        }
        
        .student-card:hover {
            transform: translateY(-5px);
        }
        
        .student-card.high-risk {
            border-color: #e94560;
        }
        
        .student-card.medium-risk {
            border-color: #f08a5d;
        }
        
        .video-thumbnail {
            background: #1a1a2e;
            height: 180px;
            position: relative;
            cursor: pointer;
        }
        
        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .risk-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 0.3rem 0.6rem;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .risk-badge.high {
            background: #e94560;
            color: white;
        }
        
        .risk-badge.medium {
            background: #f08a5d;
            color: white;
        }
        
        .student-info {
            padding: 1rem;
        }
        
        .student-name {
            font-weight: bold;
            margin-bottom: 0.3rem;
        }
        
        .student-exam {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 0.5rem;
        }
        
        .metrics {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
        }
        
        .metric {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        
        .metric.warning {
            color: #f08a5d;
        }
        
        .metric.critical {
            color: #e94560;
        }
        
        .actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        button {
            padding: 0.4rem 0.8rem;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: opacity 0.2s;
        }
        
        button:hover {
            opacity: 0.8;
        }
        
        .btn-warn {
            background: #f08a5d;
            color: white;
        }
        
        .btn-terminate {
            background: #e94560;
            color: white;
        }
        
        .btn-view {
            background: #4e8d7c;
            color: white;
        }
        
        .alerts-panel {
            flex: 1;
            background: #0f3460;
            border-radius: 10px;
            padding: 1rem;
            overflow-y: auto;
        }
        
        .alerts-panel h2 {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            color: #e94560;
        }
        
        .alert-item {
            padding: 0.8rem;
            margin-bottom: 0.5rem;
            border-radius: 5px;
            font-size: 0.9rem;
            animation: slideIn 0.3s;
        }
        
        .alert-item.critical {
            background: #e94560;
            color: white;
        }
        
        .alert-item.warning {
            background: #f08a5d;
            color: white;
        }
        
        .alert-item.info {
            background: #4e8d7c;
            color: white;
        }
        
        .alert-time {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-top: 0.2rem;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>Proctoring <span>AI</span> - Proctor Dashboard</h1>
        <div class="stats">
            <div class="stat">
                <div class="stat-label">Active Students</div>
                <div class="stat-value" id="activeCount">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">High Risk</div>
                <div class="stat-value" id="highRiskCount">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Total Alerts</div>
                <div class="stat-value" id="alertCount">0</div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="students-grid" id="studentsGrid">
            <!-- Student cards will be dynamically added here -->
        </div>
        
        <div class="alerts-panel">
            <h2>🔴 Live Alerts</h2>
            <div id="alertsList"></div>
        </div>
    </div>
    
    <script>
        // Fetch active sessions
        async function loadSessions() {
            try {
                const response = await fetch('/api/sessions');
                const sessions = await response.json();
                
                // Update stats
                document.getElementById('activeCount').textContent = sessions.length;
                const highRisk = sessions.filter(s => s.score > 0.7).length;
                document.getElementById('highRiskCount').textContent = highRisk;
                
                // Display students
                const grid = document.getElementById('studentsGrid');
                grid.innerHTML = '';
                
                sessions.forEach(session => {
                    const riskClass = session.score > 0.7 ? 'high-risk' : 
                                     session.score > 0.4 ? 'medium-risk' : '';
                    
                    const card = document.createElement('div');
                    card.className = `student-card ${riskClass}`;
                    card.innerHTML = `
                        <div class="video-thumbnail">
                            <img src="/video_feed/${session.id}" alt="Student feed">
                            <div class="risk-badge ${riskClass}">
                                ${(session.score * 100).toFixed(0)}% Risk
                            </div>
                        </div>
                        <div class="student-info">
                            <div class="student-name">${session.student}</div>
                            <div class="student-exam">${session.exam} • ${session.duration}</div>
                            <div class="actions">
                                <button class="btn-warn" onclick="warnStudent('${session.id}')">
                                    ⚠️ Warn
                                </button>
                                <button class="btn-terminate" onclick="terminateSession('${session.id}')">
                                    🛑 Terminate
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading sessions:', error);
            }
        }
        
        // Fetch alerts
        async function loadAlerts() {
            try {
                const response = await fetch('/api/sessions');
                const sessions = await response.json();
                
                let allAlerts = [];
                for (const session of sessions) {
                    const alertResponse = await fetch(`/api/session/${session.id}/alerts`);
                    const alerts = await alertResponse.json();
                    allAlerts = [...allAlerts, ...alerts];
                }
                
                // Update alert count
                document.getElementById('alertCount').textContent = allAlerts.length;
                
                // Display alerts
                const alertsList = document.getElementById('alertsList');
                alertsList.innerHTML = '';
                
                allAlerts.slice(-10).reverse().forEach(alert => {
                    const div = document.createElement('div');
                    div.className = `alert-item ${alert.severity === 3 ? 'critical' : 
                                                  alert.severity === 2 ? 'warning' : 'info'}`;
                    div.innerHTML = `
                        <strong>${alert.message}</strong>
                        <div class="alert-time">${new Date().toLocaleTimeString()}</div>
                    `;
                    alertsList.appendChild(div);
                });
            } catch (error) {
                console.error('Error loading alerts:', error);
            }
        }
        
        // Warn student
        async function warnStudent(sessionId) {
            const message = prompt('Enter warning message:');
            if (message) {
                await fetch(`/api/proctor/intervene/${sessionId}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'warn', message: message})
                });
            }
        }
        
        // Terminate session
        async function terminateSession(sessionId) {
            if (confirm('Are you sure you want to terminate this session?')) {
                await fetch(`/api/stop_session/${sessionId}`, {method: 'POST'});
                loadSessions();
            }
        }
        
        // Load data periodically
        loadSessions();
        loadAlerts();
        setInterval(loadSessions, 5000);
        setInterval(loadAlerts, 3000);
    </script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</body>
</html>
